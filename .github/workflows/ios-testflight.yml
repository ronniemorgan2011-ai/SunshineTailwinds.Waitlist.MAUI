name: MAUI iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install MAUI workload
        run: dotnet workload install maui --version 10.0.401

      - name: Install Distribution Certificate
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > certificate.p12

          openssl pkcs12 \
            -in certificate.p12 \
            -nodes \
            -password pass:$CERTIFICATE_PASSWORD \
            -out certificate.pem

          security create-keychain -p buildpass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p buildpass build.keychain

          security import certificate.pem \
            -k build.keychain \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k buildpass \
            build.keychain

      - name: Install App Store Profile
        env:
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$APPSTORE_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/SSHTAppStoreConnect.mobileprovision"

      - name: Build IPA
        run: |
          dotnet publish SunshineTailwinds.Waitlist.MAUI.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=false \
            -p:MtouchLink=SdkOnly \
            -p:RunAOTCompilation=false \
            -p:CodesignKey="Apple Distribution: Ronnie Morgan (6XP7R98XR9)" \
            -p:CodesignProvision="SSHT-AppStoreConnect" \
            -bl:publish.binlog

      - name: Find IPA
        run: |
          find . -name "*.ipa"

      - name: Create App Store Connect API Key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys

          cat > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 << EOF
          $APPSTORE_PRIVATE_KEY
          EOF

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file bin/Release/net10.0-ios/ios-arm64/publish/SunshineTailwinds.Waitlist.MAUI.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload Binlog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-binlog
          path: publish.binlog

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-ipa
          path: |
            **/*.ipa
