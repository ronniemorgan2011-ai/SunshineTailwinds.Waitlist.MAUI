name: MAUI iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install MAUI workload
        run: dotnet workload install maui --version 10.0.401

      - name: Install Distribution Certificate
        env:
          CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > certificate.p12

          openssl pkcs12 \
            -in certificate.p12 \
            -nodes \
            -password pass:$CERTIFICATE_PASSWORD \
            -out certificate.pem

          security create-keychain -p buildpass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p buildpass build.keychain

          security import certificate.pem \
            -k build.keychain \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k buildpass \
            build.keychain

      - name: List Signing Identities
        run: |
          security find-identity -v -p codesigning

      - name: Install App Store Profile
        env:
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPSTORE_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/SSHTAppStoreConnect.mobileprovision"

      - name: Build IPA
        run: |
          dotnet publish SunshineTailwinds.Waitlist.MAUI.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=false \
            -p:MtouchLink=None \
            -p:CodesignKey="Apple Distribution: Ronnie Morgan (6XP7R98XR9)" \
            -p:CodesignProvision="SSHT-AppStoreConnect"

      - name: Locate IPA
        run: |
          find . -name "*.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: testflight-ipa
      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool \
            --upload-app \
            --type ios \
            --file $(find . -name "*.ipa" | head -1) \
            --username "$APPLE_ID" \
            --password "$APP_SPECIFIC_PASSWORD"
          
          path: |
            **/*.ipa
