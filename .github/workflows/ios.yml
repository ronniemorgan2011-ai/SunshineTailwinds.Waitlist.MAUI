name: MAUI iOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install MAUI workload
        run: dotnet workload install maui --version 10.0.401

      - name: Install Apple Certificate
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$IOS_CERTIFICATE" | base64 --decode > certificate.p12

          openssl pkcs12 \
            -in certificate.p12 \
            -nodes \
            -password pass:$IOS_CERTIFICATE_PASSWORD \
            -out certificate.pem

          security create-keychain -p buildpass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p buildpass build.keychain

          security import certificate.pem \
            -k build.keychain \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k buildpass \
            build.keychain

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$PROVISIONING_PROFILE" | base64 --decode > \
          ~/Library/MobileDevice/Provisioning\ Profiles/RonnieAppDev.mobileprovision

      - name: Build Signed IPA
        run: |
          dotnet publish SunshineTailwinds.Waitlist.MAUI.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true

      - name: Locate IPA
        run: |
          find . -name "*.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa
          path: |
            **/*.ipa
