name: MAUI iOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build app
        run: >
          dotnet build SunshineTailwinds.Waitlist.MAUI.csproj
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:CodesignKey=""
          -p:EnableCodeSigning=false
          -p:ArchiveOnBuild=false

      - name: Find the .app folder
        run: find . -name "*.app" -type d

      - name: Package as IPA
        run: |
          APP=$(find ./bin -name "*.app" -type d | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr SunshineTailwindsWaitList.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: SunshineTailwindsWaitList.ipa
